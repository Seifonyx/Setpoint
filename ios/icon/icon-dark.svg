<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <radialGradient id="bg" cx="32%" cy="18%" r="105%"><stop offset="0" stop-color="#221F1A"/><stop offset="1" stop-color="#0E0D0B"/></radialGradient>
 <linearGradient id="main" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2E9E78"/><stop offset="1" stop-color="#7BDDB3"/></linearGradient>
 <linearGradient id="pro" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E0654A"/><stop offset="1" stop-color="#F59A82"/></linearGradient>
 <linearGradient id="carb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E39A3B"/><stop offset="1" stop-color="#F7C677"/></linearGradient>
 <linearGradient id="fat" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7D98D4"/><stop offset="1" stop-color="#A9C0EE"/></linearGradient>
 <radialGradient id="dot" cx="36%" cy="30%" r="72%"><stop offset="0" stop-color="#FFF0CF"/><stop offset=".45" stop-color="#F6BE63"/><stop offset="1" stop-color="#C77818"/></radialGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#F6B85C" stop-opacity=".75"/><stop offset=".45" stop-color="#F6B85C" stop-opacity=".22"/><stop offset="1" stop-color="#F6B85C" stop-opacity="0"/></radialGradient>
 <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".55"/></filter>
 <filter id="inner" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .07 0"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" filter="url(#grain)"/>
<rect width="1024" height="1024" fill="url(#vig)"/>
<!-- tracks, slightly recessed -->
<circle cx="512" cy="588" r="304" fill="none" stroke="#2C2822" stroke-width="96" stroke-linecap="round" stroke-dasharray="1432.6 1910.1" transform="rotate(135 512 588)" />
<circle cx="512" cy="588" r="298" fill="none" stroke="#37322A" stroke-width="4" stroke-linecap="round" stroke-dasharray="1404.3 1872.4" transform="rotate(135 512 588)" opacity=".7"/>
<circle cx="512" cy="588" r="212" fill="none" stroke="#2C2822" stroke-width="30" stroke-linecap="round" stroke-dasharray="999.0 1332.0" transform="rotate(135 512 588)" /><circle cx="512" cy="588" r="164" fill="none" stroke="#2C2822" stroke-width="30" stroke-linecap="round" stroke-dasharray="772.8 1030.4" transform="rotate(135 512 588)" /><circle cx="512" cy="588" r="116" fill="none" stroke="#2C2822" stroke-width="30" stroke-linecap="round" stroke-dasharray="546.6 728.8" transform="rotate(135 512 588)" />
<!-- the day: calories, then protein, carbs, fat -->
<g filter="url(#sh)"><circle cx="512" cy="588" r="304" fill="none" stroke="url(#main)" stroke-width="96" stroke-linecap="round" stroke-dasharray="1146.1 1910.1" transform="rotate(135 512 588)" /></g>
<circle cx="512" cy="588" r="212" fill="none" stroke="url(#pro)" stroke-width="30" stroke-linecap="round" stroke-dasharray="659.4 1332.0" transform="rotate(135 512 588)" /><circle cx="512" cy="588" r="164" fill="none" stroke="url(#carb)" stroke-width="30" stroke-linecap="round" stroke-dasharray="664.6 1030.4" transform="rotate(135 512 588)" /><circle cx="512" cy="588" r="116" fill="none" stroke="url(#fat)" stroke-width="30" stroke-linecap="round" stroke-dasharray="284.3 728.8" transform="rotate(135 512 588)" />
<!-- today's point -->
<circle cx="812" cy="540" r="160" fill="url(#glow)"/>
<circle cx="812" cy="540" r="70" fill="url(#dot)" filter="url(#sh)"/>
<ellipse cx="790" cy="514" rx="24" ry="15" fill="#FFFFFF" opacity=".55" transform="rotate(-25 790 514)"/>
</svg>