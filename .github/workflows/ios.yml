# Builds the native iPhone app on GitHub's Mac servers: an unsigned .ipa for SideStore, plus simulator screenshots.
# Every build lands on the "ios-preview" release (screenshots + .ipa) for review. Only an approved build (a commit
# message containing [release], or a manual run) goes to "ios-latest" and the SideStore source. A failed build posts its log to "ios-log".
name: iOS
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # releases and previews queue separately, so a preview never cancels a release that's building
  group: ios-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) && 'release' || 'preview' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version
      - name: Build the shared engine (web app search and maths) and food list
        run: node tools/ios-engine.js
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build for iPhone (unsigned, SideStore signs it)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Setpoint.xcodeproj -scheme Setpoint -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Setpoint.app out/Payload/
          (cd out && zip -qry Setpoint.ipa Payload && rm -rf Payload)
      - name: Screenshots in the iPhone simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Setpoint.xcodeproj -scheme Setpoint -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for k, v in sorted(d.items(), reverse=True) if "iOS-26" in k for x in v if x["name"].startswith("iPhone")]
          pro = [x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or phones)[0]["udid"])')
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/Setpoint.app
          shot() { xcrun simctl launch "$UDID" app.setpoint.ios -demo YES "$@"; sleep 5; }
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            for tab in diary progress foods you; do
              shot -tab $tab
              xcrun simctl io "$UDID" screenshot "out/$tab-$mode.png"
              xcrun simctl terminate "$UDID" app.setpoint.ios || true
            done
          done
          shot -tab diary -sheet weight; xcrun simctl io "$UDID" screenshot out/weight-dark.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab diary -sheet food; xcrun simctl io "$UDID" screenshot out/food-dark.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab diary -onboarding YES; xcrun simctl io "$UDID" screenshot out/onboarding-light.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab diary -page micros; xcrun simctl io "$UDID" screenshot out/micros-dark.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab diary -sheet add; xcrun simctl io "$UDID" screenshot out/add-dark.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab you -open plan; xcrun simctl io "$UDID" screenshot out/plan-dark.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab you -open plan -AppleLanguages "(ar)" -AppleLocale ar_EG; xcrun simctl io "$UDID" screenshot out/plan-dark-ar.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          shot -tab diary -AppleLanguages "(ar)" -AppleLocale ar_EG; xcrun simctl io "$UDID" screenshot out/diary-dark-ar.png; xcrun simctl terminate "$UDID" app.setpoint.ios || true
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" app.setpoint.ios -tab diary; sleep 5; xcrun simctl io "$UDID" screenshot out/empty-light.png
      - name: Publish a preview (screenshots and .ipa, not sent to SideStore)
        if: env.RELEASE != 'true'
        run: |
          gh release delete ios-preview -y --cleanup-tag || true
          gh release create ios-preview ios/out/* --prerelease --target "$GITHUB_SHA" --title "Setpoint for iPhone (preview, not released)" \
            --notes "Preview of build ${{ github.run_number }} · ${{ github.sha }}. Not in the SideStore source until approved."
      - name: Publish to the ios-latest release
        if: env.RELEASE == 'true'
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/out/* --prerelease --title "Setpoint for iPhone (latest build)" \
            --notes "Build ${{ github.run_number }} · ${{ github.sha }}. On your iPhone: download Setpoint.ipa, then open it in SideStore."
      - name: Update the SideStore source (sidestore.json)
        if: env.RELEASE == 'true'
        run: |
          python3 - <<'PY'
          import json, os, datetime
          run = os.environ["GITHUB_RUN_NUMBER"]
          raw = "https://raw.githubusercontent.com/Seifonyx/Setpoint/main/"
          rel = "https://github.com/Seifonyx/Setpoint/releases/download/ios-latest/"
          src = {
            "name": "Setpoint", "identifier": "app.setpoint.source", "sourceURL": raw + "sidestore.json",
            "iconURL": raw + "ios/Setpoint/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
            "website": "https://setpoint-tracker.web.app", "tintColor": "1C1C1E",
            "apps": [{
              "name": "Setpoint", "bundleIdentifier": "app.setpoint.ios", "developerName": "Seifonyx",
              "subtitle": "Food, nutrition and weight tracker", "tintColor": "1C1C1E",
              "localizedDescription": "Track food, nutrients and your weight trend, with targets that learn from your results.",
              "iconURL": raw + "ios/Setpoint/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
              "screenshots": [rel + n for n in ("diary-light.png", "progress-light.png", "foods-light.png", "you-light.png")],
              "versions": [{
                "version": "0.1." + run, "buildVersion": run,
                "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                "localizedDescription": "Build " + run + ".", "downloadURL": rel + "Setpoint.ipa",
                "size": os.path.getsize("ios/out/Setpoint.ipa"), "minOSVersion": "26.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          json.dump(src, open("sidestore.json", "w"), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore.json
          git commit -m "SideStore source: build ${{ github.run_number }}" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
      - name: Post the log if the build failed
        if: failure()
        run: |
          gh release delete ios-log -y --cleanup-tag || true
          git push origin :refs/tags/ios-log || true
          mkdir -p logs && cp ios/build.log ios/sim.log logs/ 2>/dev/null || true
          ls logs | grep -q . || echo "No build output (failed before compiling)" > logs/build.log
          gh release create ios-log logs/* --target "$GITHUB_SHA" --prerelease --title "iOS build log (failed)" --notes "Build ${{ github.run_number }} failed."
