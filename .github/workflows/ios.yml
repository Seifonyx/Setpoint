# Stuck in "queued" with no job? A new push replaces it (previews cancel older previews).
# Builds the native iPhone app on GitHub's Mac servers: an unsigned .ipa for SideStore, plus simulator screenshots.
# Every push is tested first (UI tests and screenshots, in two simulators at once) and only released to "ios-latest" and
# the SideStore source if the tests pass and the app didn't crash. A commit message with [preview] is never released.
# A failed build posts its log to "ios-log".
name: iOS
on:
  push:
    branches: [main, redesign]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # releases and previews queue separately, so a preview never cancels a release that's building
  group: ios-${{ (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[preview]'))) && 'release' || 'preview' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      # only main releases; other branches (a redesign waiting for approval) are always previews
      RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[preview]')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version
      - name: Build the shared engine (web app search and maths) and food list
        run: node tools/ios-engine.js
      - name: Search check (common searches must put the right food first)
        run: mkdir -p ios/out && node tools/search-check.js ios/out/search-check.txt
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build for iPhone (unsigned, SideStore signs it)
        id: build
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Setpoint.xcodeproj -scheme Setpoint -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          # Setpoint.ipa carries the Apple Health permission (ad-hoc signed so SideStore sees it).
          # Setpoint-no-health.ipa is the same app without it (widgets included), as a fallback if SideStore refuses the permission.
          mkdir -p out/Payload plain/Payload
          cp -R build/Build/Products/Release-iphoneos/Setpoint.app out/Payload/
          cp -R build/Build/Products/Release-iphoneos/Setpoint.app plain/Payload/
          # Inside out: the widgets first, then the app around them. Both share the App Group the widgets read from.
          codesign --force --sign - --entitlements Widgets/Widgets.entitlements out/Payload/Setpoint.app/PlugIns/SetpointWidgets.appex
          codesign --force --sign - --entitlements Setpoint/Setpoint-health.entitlements out/Payload/Setpoint.app
          codesign --force --sign - --entitlements Widgets/Widgets.entitlements plain/Payload/Setpoint.app/PlugIns/SetpointWidgets.appex
          codesign --force --sign - --entitlements Setpoint/Setpoint-plain.entitlements plain/Payload/Setpoint.app
          (cd out && zip -qry Setpoint.ipa Payload && rm -rf Payload)
          (cd plain && zip -qry ../out/Setpoint-no-health.ipa Payload) && rm -rf plain
      - name: Test (UI tests and screenshots, two simulators at once)
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Setpoint.xcodeproj -scheme Setpoint -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for k, v in sorted(d.items(), reverse=True) if "iOS-26" in k for x in v if x["name"].startswith("iPhone")]
          pro = [x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or phones)[0]["udid"])')
          # two simulators: the UI tests run in one while the other takes the screenshots
          S=$(xcrun simctl clone "$UDID" Shots)
          for D in "$UDID" "$S"; do
            xcrun simctl boot "$D" && xcrun simctl bootstatus "$D" -b
            xcrun simctl status_bar "$D" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          done
          xcrun simctl install "$S" simbuild/Build/Products/Debug-iphonesimulator/Setpoint.app
          xcrun simctl ui "$UDID" appearance dark
          (TEST_RUNNER_SHOTS="$PWD/out" xcodebuild test-without-building -project Setpoint.xcodeproj -scheme Setpoint -destination "id=$UDID" \
            -derivedDataPath simbuild -only-testing:SetpointUITests CODE_SIGNING_ALLOWED=NO > uitest.log 2>&1; echo done > uitest.done) &
          shot() { xcrun simctl launch "$S" app.setpoint.ios -demo YES "$@"; sleep 3; }
          for mode in light dark; do
            xcrun simctl ui "$S" appearance $mode
            for tab in diary progress foods you; do
              shot -tab $tab
              xcrun simctl io "$S" screenshot "out/$tab-$mode.png"
              xcrun simctl terminate "$S" app.setpoint.ios || true
            done
          done
          shot -tab diary -sheet weight; xcrun simctl io "$S" screenshot out/weight-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet food; xcrun simctl io "$S" screenshot out/food-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -onboarding YES; xcrun simctl io "$S" screenshot out/onboarding-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -page micros; xcrun simctl io "$S" screenshot out/micros-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet meal; xcrun simctl io "$S" screenshot out/meal-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet add -search rice; xcrun simctl io "$S" screenshot out/search-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet add; xcrun simctl io "$S" screenshot out/add-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open plan; xcrun simctl io "$S" screenshot out/plan-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          # the same screens 15 seconds in: once the food list has surely loaded (tells slow loading from values that never update)
          shot -tab diary -page micros; sleep 10; xcrun simctl io "$S" screenshot out/micros-late-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet add; sleep 10; xcrun simctl io "$S" screenshot out/add-late-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open plan; sleep 3; xcrun simctl io "$S" screenshot out/plan-late-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open export; xcrun simctl io "$S" screenshot out/export-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open targets; xcrun simctl io "$S" screenshot out/targets-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -bar compact; xcrun simctl io "$S" screenshot out/bar-compact-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open recipe; sleep 2; xcrun simctl io "$S" screenshot out/recipe-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open mine; xcrun simctl io "$S" screenshot out/mine-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -open nutrient; xcrun simctl io "$S" screenshot out/sources-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -open highin; sleep 2; xcrun simctl io "$S" screenshot out/highin-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open targets -AppleLanguages "(ar)"; xcrun simctl io "$S" screenshot out/targets-dark-ar.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet food -open units; xcrun simctl io "$S" screenshot out/units-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab progress -AppleLanguages "(ar)"; xcrun simctl io "$S" screenshot out/progress-dark-ar.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open planner; sleep 3; xcrun simctl io "$S" screenshot out/planner-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open repeating; xcrun simctl io "$S" screenshot out/repeating-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods; xcrun simctl io "$S" screenshot out/foods-tiles-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -wrapup YES -expand YES; xcrun simctl io "$S" screenshot out/today-redesign-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          xcrun simctl ui "$S" appearance light
          shot -tab diary -wrapup YES -expand YES; xcrun simctl io "$S" screenshot out/today-redesign-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open repeating; xcrun simctl io "$S" screenshot out/repeating-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab progress; xcrun simctl io "$S" screenshot out/progress-redesign-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet food; xcrun simctl io "$S" screenshot out/food-editor-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods; xcrun simctl io "$S" screenshot out/foods-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you; xcrun simctl io "$S" screenshot out/you-tiles-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet add -search chicken; xcrun simctl io "$S" screenshot out/search-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          xcrun simctl ui "$S" appearance dark
          shot -tab foods -open newfood; xcrun simctl io "$S" screenshot out/newfood-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open newmeal; xcrun simctl io "$S" screenshot out/newmeal-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open settings; xcrun simctl io "$S" screenshot out/settings-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -open story; sleep 2; xcrun simctl io "$S" screenshot out/story-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -open target; xcrun simctl io "$S" screenshot out/target-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open plan -AppleLanguages "(ar)" -AppleLocale ar_EG; xcrun simctl io "$S" screenshot out/plan-dark-ar.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -AppleLanguages "(ar)" -AppleLocale ar_EG; xcrun simctl io "$S" screenshot out/diary-dark-ar.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          xcrun simctl ui "$S" appearance light
          xcrun simctl launch "$S" app.setpoint.ios -tab diary; sleep 5; xcrun simctl io "$S" screenshot out/empty-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          # the front door: welcome, create account, sign in
          xcrun simctl ui "$S" appearance dark
          shot -tab you -open legal; xcrun simctl io "$S" screenshot out/legal-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab progress -open nutrition; sleep 2; xcrun simctl io "$S" screenshot out/progress-nutrition-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab progress -open body; sleep 2; xcrun simctl io "$S" screenshot out/progress-body-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open fasting; sleep 1; xcrun simctl io "$S" screenshot out/fasting-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab you -open ramadan; sleep 2; xcrun simctl io "$S" screenshot out/ramadan-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -open leftover; sleep 1; xcrun simctl io "$S" screenshot out/leftover-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab foods -open importrecipe; sleep 3; xcrun simctl io "$S" screenshot out/import-recipe-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          node ../tools/check-recipe-import.js > out/recipe-import.txt 2>&1 || true
          shot -tab you -open legal -legal terms; xcrun simctl io "$S" screenshot out/legal-terms-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          shot -tab diary -sheet add -addtab mine; xcrun simctl io "$S" screenshot out/add-mine-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          for m in welcome signup signin; do shot -auth $m; xcrun simctl io "$S" screenshot out/auth-$m-dark.png; xcrun simctl terminate "$S" app.setpoint.ios || true; done
          shot -auth signup -AppleLanguages "(ar)" -AppleLocale ar_EG; xcrun simctl io "$S" screenshot out/auth-signup-dark-ar.png; xcrun simctl terminate "$S" app.setpoint.ios || true
          xcrun simctl ui "$S" appearance light
          for m in welcome signin; do shot -auth $m; xcrun simctl io "$S" screenshot out/auth-$m-light.png; xcrun simctl terminate "$S" app.setpoint.ios || true; done
          # wait for the UI tests (running alongside)
          while [ ! -f uitest.done ]; do sleep 5; done
          grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)" uitest.log | tail -40 || true
          cp uitest.log out/uitest-log.txt || true
          # crash reports from the simulator (the app's own stack trace), so a crash can be read, not guessed at
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Setpoint*.ips 2>/dev/null | head -3); do cp "$f" "out/crash-$(basename "$f" .ips).txt"; done || true
          # released only when the UI tests passed and nothing crashed
          if grep -q "TEST SUCCEEDED" uitest.log && ! grep -q "crashed" uitest.log && ! ls out/crash-*.txt >/dev/null 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; echo "Tests failed: not released"; fi
      - name: Publish to the ios-latest release
        if: env.RELEASE == 'true' && steps.tests.outputs.passed == 'true'
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/out/*.ipa ios/out/*.png --prerelease --title "Setpoint for iPhone (latest build)" \
            --notes "Build ${{ github.run_number }} · ${{ github.sha }}. On your iPhone: download Setpoint.ipa, then open it in SideStore."
      - name: Update the SideStore source (sidestore.json)
        if: env.RELEASE == 'true' && steps.tests.outputs.passed == 'true'
        run: |
          python3 - <<'PY'
          import json, os, datetime
          run = os.environ["GITHUB_RUN_NUMBER"]
          raw = "https://raw.githubusercontent.com/Seifonyx/Setpoint/main/"
          rel = "https://github.com/Seifonyx/Setpoint/releases/download/ios-latest/"
          src = {
            "name": "Setpoint", "identifier": "app.setpoint.source", "sourceURL": raw + "sidestore.json",
            "iconURL": raw + "ios/Setpoint/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
            "website": "https://setpoint-tracker.web.app", "tintColor": "1C1C1E",
            "apps": [{
              "name": "Setpoint", "bundleIdentifier": "app.setpoint.ios", "developerName": "Seifonyx",
              "subtitle": "Food, nutrition and weight tracker", "tintColor": "1C1C1E",
              "localizedDescription": "Track food, nutrients and your weight trend, with targets that learn from your results.",
              "iconURL": raw + "ios/Setpoint/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
              "screenshots": [rel + n for n in ("diary-light.png", "progress-light.png", "foods-light.png", "you-light.png")],
              "versions": [{
                "version": "0.1." + run, "buildVersion": run,
                "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                "localizedDescription": "Build " + run + ".", "downloadURL": rel + "Setpoint.ipa",
                "size": os.path.getsize("ios/out/Setpoint.ipa"), "minOSVersion": "26.0"
              }],
              "appPermissions": {"entitlements": [], "privacy": {}}
            }],
            "news": []
          }
          json.dump(src, open("sidestore.json", "w"), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore.json
          git commit -m "SideStore source: build ${{ github.run_number }}" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
      - name: Publish a preview (screenshots and .ipa, not sent to SideStore)
        if: always() && steps.build.outcome == 'success'
        run: |
          gh release delete ios-preview -y --cleanup-tag || true
          if [ "$RELEASE" = "true" ]; then gh release upload ios-latest ios/out/*.png --clobber || true; fi # SideStore shows these
          gh release create ios-preview ios/out/* --prerelease --target "$GITHUB_SHA" --title "Setpoint for iPhone (preview, not released)" \
            --notes "Screenshots of build ${{ github.run_number }} · ${{ github.sha }}."
      - name: Post the log if the build failed
        if: failure()
        run: |
          gh release delete ios-log -y --cleanup-tag || true
          git push origin :refs/tags/ios-log || true
          mkdir -p logs && cp ios/build.log ios/sim.log logs/ 2>/dev/null || true
          ls logs | grep -q . || echo "No build output (failed before compiling)" > logs/build.log
          gh release create ios-log logs/* --target "$GITHUB_SHA" --prerelease --title "iOS build log (failed)" --notes "Build ${{ github.run_number }} failed."
